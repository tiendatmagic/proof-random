<!-- TOAST NOTIFICATION CONTAINER -->
<app-toast></app-toast>

<div
  class="min-h-screen flex flex-col md:flex-row bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 transition-colors duration-300"
>
  <!-- MOBILE HEADER (Chỉ hiện trên Mobile) -->
  <header
    class="md:hidden flex items-center justify-between px-4 py-3 bg-white dark:bg-slate-900 border-b border-slate-200/50 dark:border-slate-800/50 relative z-30 shrink-0"
  >
    <!-- GÓC TRÁI: Hamburger và Logo -->
    <div class="flex items-center gap-2.5">
      <!-- Hamburger button -->
      <button
        (click)="toggleMobileMenu()"
        class="p-1.5 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white rounded-lg focus:outline-none cursor-pointer"
      >
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            *ngIf="!isMobileMenuOpen()"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M4 6h16M4 12h16M4 18h16"
          />
          <path
            *ngIf="isMobileMenuOpen()"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>

      <!-- Logo & Brand -->
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 flex items-center justify-center">
          <img
            src="/logo.png"
            alt="ProofRandom Logo"
            class="w-full h-full object-contain filter drop-shadow-[0_0_8px_rgba(255,0,221,0.5)]"
          />
        </div>
        <span
          class="hidden xs:inline font-extrabold text-base tracking-tight bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] bg-clip-text text-transparent"
        >
          ProofRandom
        </span>
      </div>
    </div>

    <!-- GÓC PHẢI: Chọn mạng và Ví kết nối (với Dropdown hoạt động trên mobile) -->
    <div class="flex items-center gap-2">
      <!-- Dropdown Chọn Chain (Mobile) -->
      <app-network-dropdown [isMobile]="true"></app-network-dropdown>

      <!-- Đăng nhập ví / Thông tin ví (Mobile) -->
      <app-wallet-dropdown [isMobile]="true"></app-wallet-dropdown>
    </div>
  </header>

  <!-- SIDEBAR NAVIGATION (Desktop & Mobile Drawer) -->
  <app-sidebar [isOpen]="isMobileMenuOpen()" (closeSidebar)="closeMobileMenu()"></app-sidebar>

  <!-- MOBILE OVERLAY BACKDROP (Để đóng menu mobile khi click ra ngoài) -->
  <div
    *ngIf="isMobileMenuOpen()"
    (click)="closeMobileMenu()"
    class="fixed inset-0 bg-black/40 z-30 md:hidden"
  ></div>

  <!-- MAIN WINDOW CONTENT CONTAINER -->
  <main class="flex-1 flex flex-col min-w-0">
    <!-- HEADER BAR -->
    <header
      class="hidden md:flex items-center justify-between px-8 py-4 bg-white dark:bg-slate-900 border-b border-slate-200/50 dark:border-slate-800/50 shrink-0"
    >
      <!-- Mạng lưới (Network Status indicator) -->
      <div class="flex items-center gap-3">
        <span
          class="hidden lg:inline text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest"
          >Mạng lưới hoạt động:</span
        >
        <div
          class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold"
          [ngClass]="{
            'bg-purple-100 dark:bg-purple-950/40 text-[var(--color-primary)] border border-[var(--color-primary)]/10':
              web3Service.configuredChainId() === '42161',
            'bg-sky-100 dark:bg-sky-950/40 text-sky-500 border border-sky-500/10':
              web3Service.configuredChainId() === '8453',
            'bg-amber-100 dark:bg-amber-950/40 text-amber-500 border border-amber-500/10':
              web3Service.configuredChainId() === '56' || web3Service.configuredChainId() === '97',
            'bg-pink-100 dark:bg-pink-950/40 text-pink-500 border border-pink-500/10':
              web3Service.configuredChainId() === '421614',
            'bg-emerald-100 dark:bg-emerald-950/40 text-emerald-500 border border-emerald-500/10':
              web3Service.configuredChainId() === '31337'
          }"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-current animate-pulse"></span>
          {{ web3Service.networkName() }}
        </div>
      </div>

      <!-- WEB3 WALLET CONNECTION -->
      <div class="flex items-center gap-3">
        <!-- Dropdown Chọn Chain -->
        <app-network-dropdown></app-network-dropdown>

        <!-- Đăng nhập ví / Thông tin ví -->
        <app-wallet-dropdown></app-wallet-dropdown>
      </div>
    </header>

    <!-- BANNER CẢNH BÁO SAI CHAIN (Tràn viền sang trọng, không che màn hình) -->
    <app-wrong-chain-banner></app-wrong-chain-banner>

    <!-- MAIN PAGES SCROLLABLE WORKSPACE -->
    <div class="flex-1 overflow-y-auto p-6 md:p-8">
      <div class="max-w-[1530px] mx-auto w-full space-y-8">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
