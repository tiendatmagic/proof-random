<!-- CHƯA KẾT NỐI VÍ -->
<button
  *ngIf="!web3Service.walletConnected()"
  (click)="connectWallet()"
  class="text-white hover:bg-[var(--color-primary-hover)] transition-all flex items-center gap-1.5 cursor-pointer shadow-sm"
  [ngClass]="isMobile 
    ? 'h-[38px] px-3.5 rounded-xl bg-[var(--color-primary)] text-xs font-bold' 
    : 'btn-primary h-[44px] px-5 rounded-2xl font-extrabold text-sm'"
>
  <svg [ngClass]="isMobile ? 'w-3.5 h-3.5 shrink-0' : 'w-4 h-4'" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2.5"
      d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"
    />
  </svg>
  <span>{{ isMobile ? 'Kết nối' : 'Kết nối ví' }}</span>
</button>

<!-- ĐÃ KẾT NỐI VÍ -->
<div
  *ngIf="web3Service.walletConnected()"
  [id]="isMobile ? 'mobile-wallet-dropdown-container' : 'wallet-dropdown-container'"
  class="relative"
>
  <div
    (click)="isWalletDropdownOpen.set(!isWalletDropdownOpen())"
    class="relative flex items-center border border-[var(--color-primary)]/20 dark:border-[var(--color-primary)]/25 bg-[color-mix(in_srgb,var(--color-primary)_4%,transparent)] dark:bg-[color-mix(in_srgb,var(--color-primary)_6%,transparent)] hover:bg-[color-mix(in_srgb,var(--color-primary)_8%,transparent)] transition-all duration-200 select-none cursor-pointer"
    [ngClass]="isMobile
      ? 'gap-2 pl-2.5 pr-3 h-[38px] rounded-xl'
      : 'gap-3 pl-3.5 pr-4 h-[44px] rounded-2xl dark:hover:bg-[color-mix(in_srgb,var(--color-primary)_10%,transparent)]'"
  >
    <!-- Green active dot -->
    <span 
      class="rounded-full bg-[#3bc393] shrink-0"
      [ngClass]="isMobile ? 'w-1.5 h-1.5' : 'w-2.5 h-2.5 border border-white dark:border-slate-900'"
    ></span>

    <!-- Address and Balance -->
    <div class="flex flex-col text-left justify-center pr-0.5 -space-y-0.5">
      <span
        class="font-mono leading-none"
        [ngClass]="isMobile ? 'text-[10px] font-bold text-slate-700 dark:text-slate-300' : 'text-[12px] font-bold text-slate-700 dark:text-slate-300'"
      >
        {{ web3Service.shortAddress() }}
      </span>
      <span 
        class="font-black text-[var(--color-primary)] leading-none mt-0.5"
        [ngClass]="isMobile ? 'text-[9px]' : 'text-[12px]'"
      >
        {{ web3Service.walletBalance() }} {{ web3Service.networkSymbol() }}
      </span>
    </div>

    <!-- Chevron icon -->
    <svg
      class="text-[var(--color-primary)] transition-transform duration-200 shrink-0 ml-0.5"
      [class.rotate-180]="isWalletDropdownOpen()"
      [ngClass]="isMobile ? 'h-3 w-3' : 'h-3.5 w-3.5 ml-1'"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="3"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </div>

  <!-- Dropdown Context Menu -->
  <div
    *ngIf="isWalletDropdownOpen()"
    [ngClass]="isMobile 
      ? 'fixed left-4 right-4 top-[60px] w-auto' 
      : 'absolute right-0 mt-2 w-64'"
    class="z-[9995] rounded-[15px] bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-2xl shadow-slate-900/10 dark:shadow-black/50 overflow-hidden animate-fadeIn"
  >
    <!-- Header thông tin ví -->
    <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800/60">
      <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest leading-none mb-1">
        Ví đang kết nối
      </p>
      <p class="text-xs font-mono font-extrabold text-slate-700 dark:text-slate-200 select-all break-all">
        {{ web3Service.currentAccount() }}
      </p>
      <p class="text-xs font-black text-[var(--color-primary)] dark:text-[var(--color-primary)] mt-0.5">
        {{ web3Service.walletBalance() }} {{ web3Service.networkSymbol() }}
      </p>
    </div>

    <!-- Menu items -->
    <div class="py-1.5 px-1.5 space-y-0.5">
      <!-- Sao chép địa chỉ -->
      <button
        type="button"
        (click)="copyWalletAddress()"
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-700 dark:text-slate-300 hover:bg-[var(--color-primary)]/5 hover:text-[var(--color-primary)] transition-all text-left cursor-pointer group"
      >
        <svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          class="h-4 w-4 shrink-0 text-slate-400 group-hover:text-[var(--color-primary)] transition-colors"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
          />
        </svg>
        <span class="font-semibold">Sao chép địa chỉ ví</span>
      </button>

      <!-- Chi tiết ví -->
      <button
        type="button"
        (click)="openWalletModal($event)"
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-700 dark:text-slate-300 hover:bg-[var(--color-primary)]/5 hover:text-[var(--color-primary)] transition-all text-left cursor-pointer group"
      >
        <svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          class="h-4 w-4 shrink-0 text-slate-400 group-hover:text-[var(--color-primary)] transition-colors"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"
          />
        </svg>
        <span class="font-semibold">Chi tiết ví</span>
      </button>
    </div>

    <!-- Ngắt kết nối ví -->
    <div class="px-1.5 pb-1.5 border-t border-slate-100 dark:border-slate-800/60 pt-1.5">
      <button
        type="button"
        (click)="disconnectWallet()"
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-rose-500 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-all text-left cursor-pointer group"
      >
        <svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          class="h-4 w-4 shrink-0"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        <span class="font-bold">Ngắt kết nối ví</span>
      </button>
    </div>
  </div>
</div>
