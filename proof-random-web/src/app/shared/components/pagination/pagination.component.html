@if (totalPages() > 1) {
  <div class="px-6 py-4 border-t border-slate-100 dark:border-slate-800/50 flex items-center justify-between gap-4 flex-wrap w-full bg-transparent shrink-0">
    <span class="text-xs font-semibold text-slate-400 dark:text-slate-500">
      Hiển thị {{ startIndex() }}-{{ endIndex() }} trên tổng số {{ totalItems() }} {{ itemName() }}
    </span>
    <div class="flex items-center gap-1.5">
      <!-- Nút Previous -->
      <button
        type="button"
        (click)="goToPage(currentPage() - 1)"
        [disabled]="currentPage() === 1"
        class="w-9 h-9 rounded-full border border-slate-200 dark:border-slate-800/80 flex items-center justify-center text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-900 transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none cursor-pointer"
      >
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Các số trang -->
      @for (p of pagesArray(); track $index) {
        @if (p === '...') {
          <span class="w-9 h-9 flex items-center justify-center text-slate-400 dark:text-slate-500 text-xs font-bold">...</span>
        } @else {
          <button
            type="button"
            (click)="goToPage(toNumber(p))"
            [class]="currentPage() === p 
              ? 'bg-[var(--color-primary)] text-white font-extrabold shadow-md shadow-[var(--color-primary)]/20 border-transparent hover:opacity-90' 
              : 'bg-white dark:bg-slate-900/50 border-slate-200/50 dark:border-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 text-slate-600 dark:text-slate-400 font-semibold'"
            class="w-9 h-9 rounded-full border text-xs transition-all duration-200 active:scale-95 flex items-center justify-center cursor-pointer"
          >
            {{ p }}
          </button>
        }
      }

      <!-- Nút Next -->
      <button
        type="button"
        (click)="goToPage(currentPage() + 1)"
        [disabled]="currentPage() === totalPages()"
        class="w-9 h-9 rounded-full border border-slate-200 dark:border-slate-800/80 flex items-center justify-center text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-900 transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none cursor-pointer"
      >
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>
}
