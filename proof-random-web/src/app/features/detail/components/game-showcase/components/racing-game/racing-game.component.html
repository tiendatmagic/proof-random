      <!-- 2. Racing Skin -->
      <div
        *ngIf="skinType === 'Racing' && clientResult()"
        class="space-y-6 w-full max-w-2xl mx-auto px-4 flex flex-col items-center animate-fade-in"
      >
        <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">
          Đua xe ngẫu nhiên
        </p>

        <div
          class="w-full space-y-4 bg-slate-100/50 dark:bg-slate-950/20 p-4 rounded-2xl border border-slate-200 dark:border-slate-800/20"
        >
          <div
            *ngFor="let progress of racerProgresses(); let idx = index"
            class="relative h-10 w-full bg-slate-200/60 dark:bg-slate-900/60 rounded-xl overflow-hidden border border-slate-300/50 dark:border-slate-800/40 flex items-center px-4"
          >
            <!-- Track line -->
            <div
              class="absolute inset-x-0 h-0.5 bg-slate-300 dark:bg-slate-800/40 border-dashed border-t border-slate-400/20 dark:border-slate-700/20"
            ></div>
            <!-- Racer Name tag -->
            <span
              class="absolute left-4 z-10 text-[10px] font-bold text-slate-700 dark:text-slate-300 select-none bg-white/90 dark:bg-slate-950/80 px-2 py-0.5 rounded-md border border-slate-200 dark:border-slate-800/50"
            >
              {{ sessionDetails().participants[idx] }}
            </span>
            <!-- Vehicle moving -->
            <div
              class="absolute transition-all duration-75 flex items-center gap-1.5"
              [style.left.%]="progress"
              style="transform: translateX(-50%); margin-left: 20px"
            >
              <!-- Speed SVG Icon replacing Emoji car -->
              <svg
                class="w-5 h-5 text-[var(--color-primary)] animate-pulse"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                />
              </svg>
              <!-- Star SVG Icon replacing Emoji crown -->
              <svg
                *ngIf="raceDone() && isWinnerIndex(idx)"
                class="w-3.5 h-3.5 text-amber-500 fill-amber-500"
                viewBox="0 0 20 20"
              >
                <path
                  d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
                />
              </svg>
            </div>
            <!-- Finish Line -->
            <div
              class="absolute right-4 top-0 bottom-0 w-2 bg-gradient-to-b from-red-500 via-white to-red-500 opacity-60"
            ></div>
          </div>
        </div>

        <div class="flex gap-3 justify-center w-full" *ngIf="!raceDone()">
          <button
            (click)="startRace()"
            [disabled]="isRacing()"
            class="btn btn-primary cursor-pointer font-black text-sm flex items-center gap-2"
          >
            <span>{{ isRacing() ? 'ĐANG ĐUA...' : 'BẮT ĐẦU CUỘC ĐUA' }}</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"
              />
            </svg>
          </button>
          <button
            (click)="skipRace()"
            class="btn btn-secondary cursor-pointer font-bold text-sm flex items-center gap-1.5"
          >
            <span>Bỏ qua</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 5l7 7-7 7M5 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>

        <div *ngIf="raceDone()" class="animate-fade-in text-center space-y-2">
          <div
            class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest"
          >
            Đạt giải nhất
          </div>
          <h3
            class="text-3xl font-black bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] bg-clip-text text-transparent select-all"
          >
            {{ clientResult().winners[0] }}
          </h3>
        </div>
      </div>
