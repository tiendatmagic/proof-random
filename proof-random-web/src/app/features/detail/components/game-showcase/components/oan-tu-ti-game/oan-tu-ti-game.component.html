      <!-- 10. OanTuTi Skin -->
      <div
        *ngIf="skinType === 'OanTuTi' && clientResult()"
        class="space-y-6 w-full max-w-xl mx-auto px-4 flex flex-col items-center animate-fade-in"
      >
        <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">
          Quyết đấu Oản Tù Tì
        </p>

        <div class="flex items-center justify-between gap-10 bg-slate-50/50 dark:bg-slate-950/20 p-8 rounded-3xl border border-slate-200/50 dark:border-slate-800/30 w-full max-w-md shadow-lg relative min-h-[160px] overflow-hidden mx-auto">
          <!-- Player side -->
          <div class="flex flex-col items-center gap-3 flex-1">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Người chơi</span>
            
            <div
              [ngClass]="{
                'animate-[bounce_0.15s_infinite]': isOanTuTiRunning(),
                'border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.4)] dark:shadow-[0_0_20px_rgba(16,185,129,0.2)] bg-emerald-500/5': oanTuTiDone(),
                'border-[var(--color-primary)]/40 shadow-sm': isOanTuTiRunning(),
                'border-slate-200/50 dark:border-slate-800/50': !isOanTuTiRunning() && !oanTuTiDone()
              }"
              class="w-20 h-20 bg-white dark:bg-slate-900 border-2 rounded-2xl flex items-center justify-center relative transition-all duration-300"
            >
              <!-- Ban đầu: Ẩn hình, hiển thị dấu hỏi -->
              <span *ngIf="!isOanTuTiRunning() && !oanTuTiDone()" class="text-4xl font-extrabold text-slate-300 dark:text-slate-600 select-none">?</span>

              <!-- Đang lắc: Hiển thị nắm đấm -->
              <svg *ngIf="isOanTuTiRunning()" class="w-10 h-10 text-[var(--color-primary)] shrink-0" viewBox="0 0 448 512" fill="currentColor">
                <path d="M144 0C117.5 0 96 21.5 96 48V96v28.5V176c0 8.8-7.2 16-16 16s-16-7.2-16-16V149.3l-9 7.5C40.4 169 32 187 32 206V244c0 38 16.9 74 46.1 98.3L128 384v96c0 17.7 14.3 32 32 32H320c17.7 0 32-14.3 32-32V374.7c46.9-19 80-65 80-118.7V176 160 144c0-26.5-21.5-48-48-48c-12.4 0-23.6 4.7-32.1 12.3C350 83.5 329.3 64 304 64c-12.4 0-23.6 4.7-32.1 12.3C270 51.5 249.3 32 224 32c-12.4 0-23.6 4.7-32.1 12.3C190 19.5 169.3 0 144 0z" />
              </svg>

              <!-- Đã có kết quả -->
              <ng-container *ngIf="oanTuTiDone()">
                <!-- Búa (Rock) -->
                <svg *ngIf="playerHand() === 'rock'" class="w-10 h-10 text-emerald-500 shrink-0" viewBox="0 0 448 512" fill="currentColor">
                  <path d="M144 0C117.5 0 96 21.5 96 48V96v28.5V176c0 8.8-7.2 16-16 16s-16-7.2-16-16V149.3l-9 7.5C40.4 169 32 187 32 206V244c0 38 16.9 74 46.1 98.3L128 384v96c0 17.7 14.3 32 32 32H320c17.7 0 32-14.3 32-32V374.7c46.9-19 80-65 80-118.7V176 160 144c0-26.5-21.5-48-48-48c-12.4 0-23.6 4.7-32.1 12.3C350 83.5 329.3 64 304 64c-12.4 0-23.6 4.7-32.1 12.3C270 51.5 249.3 32 224 32c-12.4 0-23.6 4.7-32.1 12.3C190 19.5 169.3 0 144 0z" />
                </svg>
                <!-- Bao (Paper) -->
                <svg *ngIf="playerHand() === 'paper'" class="w-10 h-10 text-emerald-500 shrink-0" viewBox="0 0 512 512" fill="currentColor">
                  <path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32V240c0 8.8-7.2 16-16 16s-16-7.2-16-16V64c0-17.7-14.3-32-32-32s-32 14.3-32 32V336c0 1.5 0 3.1 .1 4.6L67.6 283c-16-15.2-41.3-14.6-56.6 1.4s-14.6 41.3 1.4 56.6L124.8 448c43.1 41.1 100.4 64 160 64H304c97.2 0 176-78.8 176-176V128c0-17.7-14.3-32-32-32s-32 14.3-32 32V240c0 8.8-7.2 16-16 16s-16-7.2-16-16V64c0-17.7-14.3-32-32-32s-32 14.3-32 32V240c0 8.8-7.2 16-16 16s-16-7.2-16-16V32z" />
                </svg>
                <!-- Kéo (Scissors) -->
                <svg *ngIf="playerHand() === 'scissors'" class="w-10 h-10 text-emerald-500 shrink-0" viewBox="0 0 512 512" fill="currentColor">
                  <path d="M40 208c-22.1 0-40 17.9-40 40s17.9 40 40 40l180.2 0c-7.6 8.5-12.2 19.7-12.2 32c0 25.3 19.5 46 44.3 47.9c-7.7 8.5-12.3 19.8-12.3 32.1c0 26.5 21.5 48 48 48l32 0 64 0c70.7 0 128-57.3 128-128l0-113.1c0-40.2-16-78.8-44.4-107.3C444.8 76.8 413.9 64 381.7 64L336 64c-21.3 0-39.3 13.9-45.6 33.1l74.5 23.7c8.4 2.7 13.1 11.7 10.4 20.1s-11.7 13.1-20.1 10.4L288 129.9l0 .1L84 65.8C62.9 59.2 40.5 70.9 33.8 92s5.1 43.5 26.2 50.2L269.5 208 40 208z" />
                </svg>
              </ng-container>
            </div>
          </div>

          <span class="text-xs font-black text-slate-400 select-none">VS</span>

          <!-- CPU side -->
          <div class="flex flex-col items-center gap-3 flex-1">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Máy (CPU)</span>
            
            <div
              [ngClass]="{
                'animate-[bounce_0.15s_infinite]': isOanTuTiRunning(),
                'border-rose-500/50 dark:border-rose-500/30 shadow-[0_0_10px_rgba(244,63,94,0.15)] bg-rose-500/5': oanTuTiDone(),
                'border-slate-300/40 shadow-sm': isOanTuTiRunning(),
                'border-slate-200/50 dark:border-slate-800/50': !isOanTuTiRunning() && !oanTuTiDone()
              }"
              class="w-20 h-20 bg-white dark:bg-slate-900 border-2 rounded-2xl flex items-center justify-center relative transition-all duration-300"
            >
              <!-- Ban đầu: Ẩn hình, hiển thị dấu hỏi -->
              <span *ngIf="!isOanTuTiRunning() && !oanTuTiDone()" class="text-4xl font-extrabold text-slate-300 dark:text-slate-600 select-none">?</span>

              <!-- Đang lắc: Hiển thị nắm đấm -->
              <svg *ngIf="isOanTuTiRunning()" class="w-10 h-10 text-slate-500 shrink-0" viewBox="0 0 448 512" fill="currentColor">
                <path d="M144 0C117.5 0 96 21.5 96 48V96v28.5V176c0 8.8-7.2 16-16 16s-16-7.2-16-16V149.3l-9 7.5C40.4 169 32 187 32 206V244c0 38 16.9 74 46.1 98.3L128 384v96c0 17.7 14.3 32 32 32H320c17.7 0 32-14.3 32-32V374.7c46.9-19 80-65 80-118.7V176 160 144c0-26.5-21.5-48-48-48c-12.4 0-23.6 4.7-32.1 12.3C350 83.5 329.3 64 304 64c-12.4 0-23.6 4.7-32.1 12.3C270 51.5 249.3 32 224 32c-12.4 0-23.6 4.7-32.1 12.3C190 19.5 169.3 0 144 0z" />
              </svg>

              <!-- Đã có kết quả -->
              <ng-container *ngIf="oanTuTiDone()">
                <!-- Búa (Rock) -->
                <svg *ngIf="cpuHand() === 'rock'" class="w-10 h-10 text-rose-500 shrink-0" viewBox="0 0 448 512" fill="currentColor">
                  <path d="M144 0C117.5 0 96 21.5 96 48V96v28.5V176c0 8.8-7.2 16-16 16s-16-7.2-16-16V149.3l-9 7.5C40.4 169 32 187 32 206V244c0 38 16.9 74 46.1 98.3L128 384v96c0 17.7 14.3 32 32 32H320c17.7 0 32-14.3 32-32V374.7c46.9-19 80-65 80-118.7V176 160 144c0-26.5-21.5-48-48-48c-12.4 0-23.6 4.7-32.1 12.3C350 83.5 329.3 64 304 64c-12.4 0-23.6 4.7-32.1 12.3C270 51.5 249.3 32 224 32c-12.4 0-23.6 4.7-32.1 12.3C190 19.5 169.3 0 144 0z" />
                </svg>
                <!-- Bao (Paper) -->
                <svg *ngIf="cpuHand() === 'paper'" class="w-10 h-10 text-rose-500 shrink-0" viewBox="0 0 512 512" fill="currentColor">
                  <path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32V240c0 8.8-7.2 16-16 16s-16-7.2-16-16V64c0-17.7-14.3-32-32-32s-32 14.3-32 32V336c0 1.5 0 3.1 .1 4.6L67.6 283c-16-15.2-41.3-14.6-56.6 1.4s-14.6 41.3 1.4 56.6L124.8 448c43.1 41.1 100.4 64 160 64H304c97.2 0 176-78.8 176-176V128c0-17.7-14.3-32-32-32s-32 14.3-32 32V240c0 8.8-7.2 16-16 16s-16-7.2-16-16V64c0-17.7-14.3-32-32-32s-32 14.3-32 32V240c0 8.8-7.2 16-16 16s-16-7.2-16-16V32z" />
                </svg>
                <!-- Kéo (Scissors) -->
                <svg *ngIf="cpuHand() === 'scissors'" class="w-10 h-10 text-rose-500 shrink-0" viewBox="0 0 512 512" fill="currentColor">
                  <path d="M40 208c-22.1 0-40 17.9-40 40s17.9 40 40 40l180.2 0c-7.6 8.5-12.2 19.7-12.2 32c0 25.3 19.5 46 44.3 47.9c-7.7 8.5-12.3 19.8-12.3 32.1c0 26.5 21.5 48 48 48l32 0 64 0c70.7 0 128-57.3 128-128l0-113.1c0-40.2-16-78.8-44.4-107.3C444.8 76.8 413.9 64 381.7 64L336 64c-21.3 0-39.3 13.9-45.6 33.1l74.5 23.7c8.4 2.7 13.1 11.7 10.4 20.1s-11.7 13.1-20.1 10.4L288 129.9l0 .1L84 65.8C62.9 59.2 40.5 70.9 33.8 92s5.1 43.5 26.2 50.2L269.5 208 40 208z" />
                </svg>
              </ng-container>
            </div>
          </div>
        </div>

        <div class="flex gap-3 justify-center w-full" *ngIf="!oanTuTiDone()">
          <button
            (click)="startOanTuTi()"
            [disabled]="isOanTuTiRunning()"
            class="btn btn-primary cursor-pointer font-black text-sm flex items-center gap-2"
          >
            <span>{{ isOanTuTiRunning() ? 'ĐANG ĐẤU...' : 'OẢN TÙ TÌ RA CÁI NÀY!' }}</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </button>
          <button
            (click)="skipOanTuTi()"
            class="btn btn-secondary cursor-pointer font-bold text-sm flex items-center gap-1.5"
          >
            <span>Bỏ qua</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <div *ngIf="oanTuTiDone()" class="animate-fade-in text-center space-y-2 max-w-sm">
          <div class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">
            Kết quả tỉ thí
          </div>
          <h3 class="text-lg font-black bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] bg-clip-text text-transparent leading-relaxed select-all">
            {{ oanTuTiResultText() }}
          </h3>
        </div>
      </div>
