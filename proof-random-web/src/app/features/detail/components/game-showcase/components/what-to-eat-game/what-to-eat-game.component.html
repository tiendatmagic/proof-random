      <!-- 13. What to Eat Skin -->
      <div
        *ngIf="skinType === 'WhatToEat' && clientResult()"
        class="space-y-6 w-full max-w-xl mx-auto px-4 flex flex-col items-center animate-fade-in"
      >
        <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">
          Hôm nay ăn gì?
        </p>

        <!-- Đĩa bạc đậy thức ăn -->
        <div class="relative w-72 h-72 flex items-center justify-center">
          <!-- Food cover / Cloche SVG -->
          <div
            [ngClass]="{
              'animate-[bounce_0.2s_infinite]': isFoodOpening(),
              'translate-y-[-100px] opacity-0 pointer-events-none': foodOpened(),
              'transition-all duration-700': foodOpened()
            }"
            class="absolute w-56 h-44 z-20 flex items-center justify-center text-slate-400 dark:text-slate-500"
          >
            <!-- Cloche SVG -->
            <svg class="w-full h-full drop-shadow-lg" viewBox="0 0 24 24" fill="currentColor">
              <!-- Nắp đậy -->
              <path d="M12 3a1 1 0 011 1v1h.5A7.5 7.5 0 0121 12.5v1.5H3v-1.5A7.5 7.5 0 0110.5 5H11V4a1 1 0 011-1z" />
              <!-- Khay -->
              <path d="M2 17h20v2H2z" />
            </svg>
          </div>

          <!-- Món ăn hiển thị sau khi mở nắp -->
          <div
            [ngClass]="{
              'scale-100 opacity-100': foodOpened(),
              'scale-50 opacity-0': !foodOpened()
            }"
            class="absolute inset-0 flex flex-col items-center justify-center bg-white dark:bg-slate-900 border border-slate-200/50 dark:border-slate-800/30 rounded-full shadow-2xl p-6 transition-all duration-500"
          >
            <!-- Icon đĩa thức ăn đẹp mắt -->
            <svg class="w-16 h-16 text-rose-500 animate-pulse mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
            </svg>
            <!-- Nếu chỉ có 1 món ăn -->
            <ng-container *ngIf="clientResult().winners.length === 1">
              <span class="text-[10px] font-bold text-rose-500 uppercase tracking-widest mb-1.5">Món ngon hôm nay</span>
              <h3 class="text-xl font-black text-center text-slate-800 dark:text-white max-w-xs break-words px-2 leading-snug">
                {{ clientResult().winners[0] }}
              </h3>
            </ng-container>

            <!-- Nếu có nhiều món ăn -->
            <ng-container *ngIf="clientResult().winners.length > 1">
              <span class="text-[10px] font-bold text-rose-500 uppercase tracking-widest mb-2">Thực đơn hôm nay của bạn</span>
              <div class="flex flex-wrap justify-center gap-1.5 max-w-[200px] max-h-[120px] overflow-y-auto pr-1">
                <span *ngFor="let item of clientResult().winners" 
                      class="px-2.5 py-1 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/40 dark:border-slate-700/40 text-[11px] font-extrabold text-slate-800 dark:text-white shadow-sm flex items-center gap-1">
                  <span class="w-1 h-1 rounded-full bg-rose-500 shrink-0"></span>
                  {{ item }}
                </span>
              </div>
            </ng-container>
          </div>
        </div>

        <!-- Điều khiển -->
        <div class="flex gap-3 justify-center w-full" *ngIf="!foodOpened()">
          <button
            (click)="startWhatToEat()"
            [disabled]="isFoodOpening()"
            class="btn btn-primary cursor-pointer font-black text-sm flex items-center gap-2"
          >
            <span>{{ isFoodOpening() ? 'ĐANG MỞ NẮP...' : 'MỞ NẮP ĐĨA BẠC' }}</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 11V7a4 4 0 118 0v4m0 0a2 2 0 100 4 2 2 0 000-4M8 11a2 2 0 110 4 2 2 0 000-4M8 11a2 2 0 110 4 2 2 0 010-4m0 0V7a4 4 0 018 0v4" />
            </svg>
          </button>
          <button
            (click)="skipWhatToEat()"
            class="btn btn-secondary cursor-pointer font-bold text-sm flex items-center gap-1.5"
          >
            <span>Bỏ qua</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <!-- Khối chúc mừng khi đã mở xong -->
        <div *ngIf="foodOpened()" class="bg-rose-500/5 border border-rose-500/20 rounded-2xl p-4 w-full max-w-sm text-center animate-fade-in">
          <p class="text-xs text-rose-500 dark:text-rose-400 font-bold">Thưởng thức món ăn thôi nào! Chúc bạn ngon miệng!</p>
        </div>
      </div>
