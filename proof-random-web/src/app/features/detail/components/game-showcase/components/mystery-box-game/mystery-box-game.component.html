      <!-- 3. Mystery Box Skin -->
      <div
        *ngIf="skinType === 'MysteryBox' && clientResult()"
        class="space-y-6 mx-auto flex flex-col items-center animate-fade-in"
      >
        <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">
          Hộp quà bí ẩn
        </p>

        <div class="relative w-56 h-56 flex items-center justify-center mx-auto">
          <div
            [ngClass]="{
              'animate-[bounce_0.6s_infinite]': isBoxOpening(),
              'scale-105': boxOpened(),
            }"
            class="transition-transform duration-500 flex items-center justify-center"
          >
            <!-- Beautiful 3D Gift Box SVG (Closed) -->
            <svg
              *ngIf="!boxOpened()"
              class="w-40 h-40 filter drop-shadow-[0_0_25px_rgba(236,72,153,0.55)]"
              viewBox="0 0 200 200"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- Shadow under box -->
              <ellipse cx="100" cy="180" rx="60" ry="12" fill="rgba(0,0,0,0.15)" />

              <!-- Box Body -->
              <path
                d="M40 90 L100 120 L160 90 L160 160 L100 190 L40 160 Z"
                fill="url(#boxBodyGrad)"
              />
              <path d="M100 120 L160 90 L160 160 L100 190 Z" fill="rgba(0,0,0,0.1)" />
              <!-- shading -->

              <!-- Vertical Ribbon on Body -->
              <path d="M90 115 L110 125 L110 185 L90 180 Z" fill="url(#ribbonGrad)" />

              <!-- Box Lid -->
              <path d="M34 76 L100 108 L166 76 L166 94 L100 126 L34 94 Z" fill="url(#boxLidGrad)" />
              <path d="M100 108 L166 76 L166 94 L100 126 Z" fill="rgba(0,0,0,0.1)" />
              <!-- shading -->

              <!-- Top Ribbon on Lid -->
              <path
                d="M34 76 L100 108 L166 76"
                stroke="url(#ribbonGrad)"
                stroke-width="16"
                stroke-linecap="round"
              />

              <!-- Ribbon Bow on Top -->
              <path
                d="M100 70 C75 40, 60 70, 100 75 Z"
                fill="url(#ribbonGrad)"
                stroke="#fff"
                stroke-width="1"
              />
              <path
                d="M100 70 C125 40, 140 70, 100 75 Z"
                fill="url(#ribbonGrad)"
                stroke="#fff"
                stroke-width="1"
              />
              <circle cx="100" cy="72" r="10" fill="#FFE082" stroke="#FFD54F" stroke-width="2" />

              <!-- Gradients definitions -->
              <defs>
                <linearGradient
                  id="boxBodyGrad"
                  x1="40"
                  y1="90"
                  x2="160"
                  y2="190"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0%" stop-color="#ec4899" />
                  <stop offset="100%" stop-color="#8b5cf6" />
                </linearGradient>
                <linearGradient
                  id="boxLidGrad"
                  x1="34"
                  y1="76"
                  x2="166"
                  y2="126"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0%" stop-color="#f43f5e" />
                  <stop offset="100%" stop-color="#a855f7" />
                </linearGradient>
                <linearGradient
                  id="ribbonGrad"
                  x1="90"
                  y1="70"
                  x2="110"
                  y2="185"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0%" stop-color="#fbbf24" />
                  <stop offset="100%" stop-color="#f59e0b" />
                </linearGradient>
              </defs>
            </svg>

            <!-- Beautiful 3D Gift Box SVG (Open with Sparkles) -->
            <svg
              *ngIf="boxOpened()"
              class="w-40 h-40 filter drop-shadow-[0_0_35px_rgba(251,191,36,0.6)]"
              viewBox="0 0 200 200"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- Shadow under box -->
              <ellipse cx="100" cy="180" rx="60" ry="12" fill="rgba(0,0,0,0.15)" />

              <!-- Magic Light Beam -->
              <path d="M100 120 L50 20 L150 20 Z" fill="url(#magicBeamGrad)" opacity="0.35" />

              <!-- Confetti Circles & Stars -->
              <circle cx="45" cy="40" r="5" fill="#f43f5e" class="animate-pulse" />
              <circle cx="155" cy="45" r="6" fill="#3b82f6" class="animate-pulse" />
              <circle cx="75" cy="15" r="4" fill="#10b981" />
              <circle cx="125" cy="12" r="5" fill="#fbbf24" />
              <path d="M35 70 L38 73 L35 76 L32 73 Z" fill="#a855f7" />
              <path d="M165 80 L168 83 L165 86 L162 83 Z" fill="#ec4899" />

              <!-- Box Body (Open) -->
              <path
                d="M40 90 L100 120 L160 90 L160 160 L100 190 L40 160 Z"
                fill="url(#boxBodyGrad)"
              />
              <path d="M100 120 L160 90 L160 160 L100 190 Z" fill="rgba(0,0,0,0.1)" />
              <!-- shading -->

              <!-- Inner box glow (represents the gift inside) -->
              <ellipse cx="100" cy="105" rx="45" ry="15" fill="#fff" opacity="0.9" />

              <!-- Vertical Ribbon on Body -->
              <path d="M90 115 L110 125 L110 185 L90 180 Z" fill="url(#ribbonGrad)" />

              <!-- Detached Lid flying away and rotating -->
              <g
                style="
                  transform: translate(-15px, -40px) rotate(-18deg);
                  transform-origin: 100px 100px;
                "
              >
                <path
                  d="M34 76 L100 108 L166 76 L166 94 L100 126 L34 94 Z"
                  fill="url(#boxLidGrad)"
                />
                <path d="M100 108 L166 76 L166 94 L100 126 Z" fill="rgba(0,0,0,0.1)" />
                <!-- Top Ribbon on Lid -->
                <path
                  d="M34 76 L100 108 L166 76"
                  stroke="url(#ribbonGrad)"
                  stroke-width="16"
                  stroke-linecap="round"
                />
                <!-- Bow Tie on Lid -->
                <path
                  d="M100 70 C75 40, 60 70, 100 75 Z"
                  fill="url(#ribbonGrad)"
                  stroke="#fff"
                  stroke-width="1"
                />
                <path
                  d="M100 70 C125 40, 140 70, 100 75 Z"
                  fill="url(#ribbonGrad)"
                  stroke="#fff"
                  stroke-width="1"
                />
                <circle cx="100" cy="72" r="10" fill="#FFE082" stroke="#FFD54F" stroke-width="2" />
              </g>

              <!-- Gradients definitions -->
              <defs>
                <linearGradient
                  id="boxBodyGrad"
                  x1="40"
                  y1="90"
                  x2="160"
                  y2="190"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0%" stop-color="#ec4899" />
                  <stop offset="100%" stop-color="#8b5cf6" />
                </linearGradient>
                <linearGradient
                  id="boxLidGrad"
                  x1="34"
                  y1="76"
                  x2="166"
                  y2="126"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0%" stop-color="#f43f5e" />
                  <stop offset="100%" stop-color="#a855f7" />
                </linearGradient>
                <linearGradient
                  id="ribbonGrad"
                  x1="90"
                  y1="70"
                  x2="110"
                  y2="185"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0%" stop-color="#fbbf24" />
                  <stop offset="100%" stop-color="#f59e0b" />
                </linearGradient>
                <linearGradient
                  id="magicBeamGrad"
                  x1="100"
                  y1="120"
                  x2="100"
                  y2="20"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
                  <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>

        <div class="flex gap-3 justify-center w-full" *ngIf="!boxOpened()">
          <button
            (click)="openBox()"
            [disabled]="isBoxOpening()"
            class="btn btn-primary cursor-pointer font-black text-sm"
          >
            {{ isBoxOpening() ? 'ĐANG MỞ...' : 'MỞ HỘP QUÀ' }}
          </button>
          <button
            (click)="skipBox()"
            class="btn btn-secondary cursor-pointer font-bold text-sm flex items-center gap-1.5"
          >
            <span>Bỏ qua</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 5l7 7-7 7M5 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>

        <div *ngIf="boxOpened()" class="animate-fade-in text-center space-y-2">
          <div
            class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest"
          >
            Phần thưởng trúng giải
          </div>
          <h3
            class="text-3xl font-black bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] bg-clip-text text-transparent select-all"
          >
            {{ clientResult().winners[0] }}
          </h3>
        </div>
      </div>
