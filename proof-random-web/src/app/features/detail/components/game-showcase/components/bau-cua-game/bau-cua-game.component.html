      <!-- 4. Bau Cua Skin -->
      <div
        *ngIf="skinType === 'BauCua' && clientResult()"
        class="space-y-6 w-full max-w-2xl mx-auto px-4 flex flex-col items-center animate-fade-in"
      >
        <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">
          Lắc Bầu Cua Tôm Cá
        </p>

        <div class="relative w-48 h-48 flex items-center justify-center mx-auto">
          <div
            [ngClass]="{
              'animate-[bounce_0.4s_infinite]': isBauCuaShaking(),
              'translate-y-[-20px] opacity-0 pointer-events-none': bauCuaOpened(),
            }"
            class="absolute z-10 w-36 h-36 rounded-full bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700/50 backdrop-blur-md shadow-2xl flex items-center justify-center transition-all duration-700 select-none mx-auto"
          >
            <!-- Sleek container lid replacing soup bowl emoji -->
            <div
              class="w-24 h-24 rounded-full bg-gradient-to-tr from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-900 border border-slate-200/80 dark:border-slate-700/50 shadow-inner flex items-center justify-center font-black text-slate-500 dark:text-slate-400 text-xs tracking-wider"
            >
              BÁT ÚP
            </div>
          </div>
          <div
            class="w-40 h-40 rounded-full bg-slate-100 dark:bg-slate-900 border-4 border-slate-200/80 dark:border-slate-800/40 shadow-inner flex items-center justify-center gap-3 mx-auto"
          >
            <ng-container *ngIf="bauCuaOpened()">
              <div
                *ngFor="let die of bauCuaResultDice"
                class="w-12 h-12 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-[var(--color-primary)]/40 flex items-center justify-center text-xs font-extrabold text-[var(--color-primary)] shadow-md select-none"
              >
                {{ bauCuaItems[die].name }}
              </div>
            </ng-container>
            <span
              *ngIf="!bauCuaOpened() && !isBauCuaShaking()"
              class="text-xs font-bold text-slate-400 dark:text-slate-500"
              >Đang úp bát</span
            >
          </div>
        </div>

        <div class="flex gap-3 justify-center w-full" *ngIf="!bauCuaOpened()">
          <button
            (click)="shakeBauCua()"
            [disabled]="isBauCuaShaking()"
            class="btn btn-primary cursor-pointer font-black text-sm flex items-center gap-2"
          >
            <span>{{ isBauCuaShaking() ? 'ĐANG LẮC...' : 'LẮC BẦU CUA' }}</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <rect
                x="4"
                y="4"
                width="16"
                height="16"
                rx="2"
                stroke="currentColor"
                stroke-width="2"
              />
              <circle cx="8" cy="8" r="1" fill="currentColor" />
              <circle cx="16" cy="16" r="1" fill="currentColor" />
              <circle cx="12" cy="12" r="1" fill="currentColor" />
            </svg>
          </button>
          <button
            (click)="skipBauCua()"
            class="btn btn-secondary cursor-pointer font-bold text-sm flex items-center gap-1.5"
          >
            <span>Bỏ qua</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 5l7 7-7 7M5 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>

        <div *ngIf="bauCuaOpened()" class="animate-fade-in text-center space-y-3">
          <div
            class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest"
          >
            Kết quả xúc xắc linh vật
          </div>
          <div class="flex gap-2.5 justify-center">
            <div
              *ngFor="let die of bauCuaResultDice"
              class="px-3 py-1.5 rounded-lg bg-[var(--color-primary)]/10 border border-[var(--color-primary)]/15 text-xs font-extrabold text-[var(--color-primary)] select-none"
            >
              {{ bauCuaItems[die].name }}
            </div>
          </div>
        </div>
      </div>
